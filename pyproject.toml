[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "aiorganize"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
    "playwright>=1.63.0",
    "pydantic>=2,<3",
]
