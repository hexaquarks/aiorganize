[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "aiorganize"
version = "0.1.0"
description = "AI-powered Chrome tab organization with user-approved groups."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pyjwt>=2.15.1",
    "qdrant-client>=1.19.1",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]
