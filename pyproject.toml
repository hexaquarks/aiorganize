[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "aiorganize"
version = "0.1.0"
description = "AI-powered Chrome tab organization with user-approved groups."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.63.0",
]
