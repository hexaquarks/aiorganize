AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Organize saved groupings API

Parameters:
  QdrantEndpoint:
    Type: String
    AllowedPattern: 'https://.+'
  QdrantApiKey:
    Type: String
    NoEcho: true
    MinLength: 1
  AppSigningSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  QdrantCollection:
    Type: String
    Default: aiorganize_groups_v1_text_embedding_3_small_1536

Resources:
  GroupingsApi:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildArchitecture: arm64
    Properties:
      CodeUri: .
      Handler: src.lambda_handler.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt ApiRole.Arn
      LoggingConfig:
        LogGroup: !Ref ApiLogs
      Environment:
        Variables:
          QDRANT_ENDPOINT: !Ref QdrantEndpoint
          QDRANT_API_KEY: !Ref QdrantApiKey
          QDRANT_COLLECTION: !Ref QdrantCollection
          APP_SIGNING_SECRET: !Ref AppSigningSecret
          ACCESS_TABLE: !Ref AccessTable
      Events:
        Register:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/installations
            Method: POST
        Save:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/groupings
            Method: POST
        Search:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/groupings/search
            Method: POST
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 2

  AccessTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      OnDemandThroughput:
        MaxReadRequestUnits: 20
        MaxWriteRequestUnits: 20

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteApiLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ApiLogs.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt AccessTable.Arn

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  AccessTableName:
    Value: !Ref AccessTable
