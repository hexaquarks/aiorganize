<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Organize</title>
    <link rel="stylesheet" href="panel.css">
    <script src="background.js" defer></script>
    <script type="module" src="panel-entry.js"></script>
  </head>
  <body>
    <main>
      <header>
        <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>AI Organize</span></div>
        <h1>Less clutter.<br>More focus.</h1>
        <p class="intro">A place for every tab.</p>
      </header>
      <button id="organize" type="button">
        <span aria-hidden="true">✦</span><span id="organize-label">Organize tabs</span>
      </button>
      <div class="status-line">
        <span id="activity" aria-hidden="true"></span>
        <p id="status" role="status" aria-live="polite">Ready when you are.</p>
      </div>
      <section id="preview" aria-labelledby="preview-heading" hidden>
        <div class="section-heading">
          <h2 id="preview-heading">Your new workspace</h2><span class="preview-badge">Preview</span>
        </div>
        <p id="summary"></p>
        <div id="groups"></div>
        <div class="actions">
          <button id="reject" class="secondary" type="button">Reject</button>
          <button id="approve" type="button">Approve &amp; apply <span aria-hidden="true">→</span></button>
        </div>
      </section>
    </main>
  </body>
</html>
